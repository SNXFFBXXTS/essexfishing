<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1726">
<title>Shoebury Fishing Guide</title>
<style>
:root{--bg:#0b1726;--panel:#13243a;--panel2:#1a304c;--line:#22395a;--ink:#eef4fa;--dim:#9db3ca;--acc:#3fd0c9;--warn:#ffd166;--bad:#ff8a80;--good:#7ee081}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 10px 0}
.tbar{display:flex;gap:6px;align-items:center}
.tbar button{font:inherit;font-size:20px;color:var(--ink);background:var(--panel2);border:1px solid #2c4a70;border-radius:12px;width:48px;height:48px;flex:none}
.tlabel{flex:1;text-align:center;line-height:1.2;font:inherit;color:var(--ink);background:var(--panel2);border:1px solid #2c4a70;border-radius:12px;padding:4px 6px;min-height:48px}
.tbar button.tlabel{flex:1;width:auto;height:auto;font-size:15px}
.tlabel i{font-style:normal;font-size:12px;color:var(--dim)}
.tlabel b{font-size:17px}
.tlabel span{font-size:12px;font-weight:700;letter-spacing:.08em;padding:1px 7px;border-radius:5px;color:#06121f}
.tbar button.live{width:auto;padding:0 12px;font-size:15px;font-weight:700}
.tbar button.live.on{background:var(--acc);color:#06121f;border-color:var(--acc)}
.days{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.days::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.days button{flex:none;font:inherit;font-size:14px;color:var(--dim);background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:5px 10px;line-height:1.2}
.days button b{display:block;color:var(--ink);font-size:15px}
.days button.sel{border-color:var(--acc)}
input[type=range]{width:100%;margin:6px 0 2px;accent-color:var(--acc);height:28px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
.tabs button{flex:none;font:inherit;font-size:16px;color:var(--dim);background:none;border:0;border-bottom:3px solid transparent;padding:6px 8px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--acc)}
main{flex:1;overflow-y:auto;padding:12px 14px 30px}
h2{font-size:22px;margin:2px 0 10px}
h3{font-size:14px;color:var(--dim);margin:20px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.dim,.card small{color:var(--dim)}
small{font-size:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:7px;color:#06121f;font-weight:700}
ul.r{margin:8px 0 0;padding-left:20px}ul.r li{margin:5px 0}
.ok{color:var(--good)}.meh{color:var(--warn)}.bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--panel);border-radius:14px;padding:10px 12px}
.tile div{font-size:14px;color:var(--dim)}
.tile b{font-size:21px;display:block;line-height:1.25}
.tile small{font-size:13px}
.big{font-size:20px}
table{width:100%;border-collapse:collapse}
td{padding:7px 0;vertical-align:top;border-bottom:1px solid #1d3352}
tr:last-child td{border-bottom:0}
td.k{color:var(--dim);width:40%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:2px solid transparent;border-radius:12px;padding:9px 12px;text-align:left}
.chip small{display:block;color:var(--dim);font-size:13px}
.chip.sel{border-color:var(--acc);background:#163a4a}
.fish{background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.fish .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fish .name{font-weight:700;font-size:19px}
.meter{height:10px;background:#0a1422;border-radius:6px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;border-radius:6px}
.fix{font-size:15px;color:var(--dim);margin-top:6px}
.fix b{color:var(--warn)}
.tl{display:flex;align-items:flex-end;gap:2px;height:110px;margin-top:16px}
.tl div{flex:1;border-radius:3px 3px 0 0;position:relative;min-height:3px}
.tl div span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink)}
.tlx{display:flex;gap:2px;font-size:11px;color:var(--dim);margin-top:4px}
.tlx span{flex:1;text-align:center}
button.use{font:inherit;font-size:16px;color:#06121f;background:var(--acc);border:0;border-radius:10px;padding:10px 14px;margin-top:10px;font-weight:700}
button.plain{font:inherit;font-size:16px;color:var(--ink);background:var(--panel2);border:1px solid #2c4a70;border-radius:10px;padding:10px 14px}
.setline{font-size:17px;line-height:1.6}
.setline b{color:var(--acc)}
.dayrow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:8px;width:100%;font:inherit;color:var(--ink);border:0;text-align:left}
.dayrow .d{font-weight:700;font-size:18px}
.dayrow small{display:block}
.note{background:#2a2410;border:1px solid #5a4a20;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:15px}
</style>
</head>
<body>
<header>
  <div class="tbar">
    <button id="tPrev" aria-label="1 hour back">◀</button>
    <button class="tlabel" id="tLabel"></button>
    <button id="tNext" aria-label="1 hour forward">▶</button>
    <button id="tLive" class="live">Live</button>
  </div>
  <div id="tpanel" hidden>
    <div class="days" id="days"></div>
    <input type="range" id="tHour" min="0" max="23" step="1" aria-label="Hour of day">
    <div class="dim" style="font-size:13px;text-align:center;margin-bottom:2px">Pick a day, then slide to set the hour</div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<script>

"use strict";
// =====================================================================
// LIVE DATA — Shoebury East (51.53N, 0.79E)
// EA Southend tide gauge (observed) calibrates the Open-Meteo marine tide
// curve; Open-Meteo forecast gives wind/pressure/cloud/rain hour by hour.
// Falls back to saved data, then an astronomical tide model.
// =====================================================================
const LAT=51.53,LON=0.79,SYN=29.530588853,NEWMOON=Date.UTC(2000,0,6,18,14),CD_OFF=2.9,H=3.6e6;
const now=()=>Date.now();
const month=t=>new Date(t).getMonth()+1;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const hm=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const hh=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit'});
const ago=t=>{const m=Math.round((now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' hr ago'};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const moonAge=t=>(((t-NEWMOON)/864e5)%SYN+SYN)%SYN;
function modelH(t){const a=moonAge(t),amp=2.05+0.55*Math.cos(2*Math.PI*(a-1.5)/(SYN/2)),Hm=((t/H)%24)-12-a*24/SYN;return 3.3+amp*Math.cos(2*Math.PI*(Hm-0.15)/12)}

const WXVARS='temperature_2m,precipitation,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code';
const FEEDS={
  ea:{name:'Southend tide gauge (Environment Agency)',
      url:'https://environment.data.gov.uk/flood-monitoring/id/stations/0019/readings?_sorted&_limit=120',
      parse:j=>{const a=(j.items||[]).filter(r=>typeof r.value==='number').map(r=>({t:Date.parse(r.dateTime),v:r.value+CD_OFF})).sort((x,y)=>x.t-y.t);
        if(a.length<8)throw Error('no recent readings');return a}},
  om:{name:'Tide curve, waves & sea temp (Open-Meteo marine)',
      url:'https://marine-api.open-meteo.com/v1/marine?latitude=51.50&longitude=0.85&hourly=sea_level_height_msl,wave_height,sea_surface_temperature&past_days=1&forecast_days=8&timeformat=unixtime&timezone=GMT&cell_selection=sea',
      parse:j=>{const h=j.hourly;if(!h||!h.time)throw Error('bad response');const sl=h.sea_level_height_msl||[];
        if(sl.filter(x=>x!=null).length<24)throw Error('no tide data for this spot');
        return{t:h.time.map(x=>x*1000),sl,wave:h.wave_height||[],sst:h.sea_surface_temperature||[]}}},
  wx:{name:'Wind, pressure, cloud & rain (Open-Meteo)',
      url:'https://api.open-meteo.com/v1/forecast?latitude=51.53&longitude=0.79&current='+WXVARS+'&hourly='+WXVARS+'&past_hours=7&forecast_hours=170&wind_speed_unit=mph&timeformat=unixtime&timezone=GMT',
      parse:j=>{if(!j.current||!j.hourly)throw Error('bad response');const h=j.hourly;h.t=h.time.map(x=>x*1000);return{cur:j.current,h}}}
};
const D={err:{},T:{}};
try{const c=JSON.parse(localStorage.getItem('sfish-data2'));if(c)for(const k in FEEDS)if(c[k]&&now()-c.T[k]<36*H){D[k]=c[k];D.T[k]=c.T[k]}}catch(e){}
async function refresh(){
  await Promise.all(Object.keys(FEEDS).map(async k=>{
    try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
      const r=await fetch(FEEDS[k].url,{cache:'no-store',signal:ctl.signal});clearTimeout(to);
      if(!r.ok)throw Error('HTTP '+r.status);D[k]=FEEDS[k].parse(await r.json());D.T[k]=now();D.err[k]=null}
    catch(e){D.err[k]=e.name==='AbortError'?'timed out':(e.message||String(e))}}));
  try{localStorage.setItem('sfish-data2',JSON.stringify({ea:D.ea,om:D.om,wx:D.wx,T:D.T}))}catch(e){}
  calibrate();render();
}

// ---- tide curve ----
let CAL={a:1,b:3,lag:0,res:0,resT:0,fit:null,src:'Estimate (moon model)'};
function omAt(t){const o=D.om;if(!o)return null;const n=o.t.length,dt=o.t[1]-o.t[0],f=(t-o.t[0])/dt,i=Math.floor(f);if(i<1||i>n-3)return null;
  const p0=o.sl[i-1],p1=o.sl[i],p2=o.sl[i+1],p3=o.sl[i+2];if([p0,p1,p2,p3].some(x=>x==null))return null;
  const u=f-i;return .5*(2*p1+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u*u+(-p0+3*p1-3*p2+p3)*u*u*u)}
function omNear(arr,t){const o=D.om;if(!o||!arr||!arr.length)return null;const i=Math.round((t-o.t[0])/(o.t[1]-o.t[0]));return i>=0&&i<arr.length?arr[i]:null}
function solve3(M,v){M=M.map((r,i)=>[...r,v[i]]);for(let c=0;c<3;c++){let p=c;for(let r=c+1;r<3;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];
  if(Math.abs(M[c][c])<1e-9)return null;for(let r=0;r<3;r++)if(r!==c){const f=M[r][c]/M[c][c];for(let k=c;k<4;k++)M[r][k]-=f*M[c][k]}}return M.map((r,i)=>r[3]/r[i])}
function baseTide(t){
  if(D.om){const v=omAt(t-CAL.lag);if(v!=null)return CAL.a*v+CAL.b}
  if(CAL.fit&&Math.abs(t-CAL.fit.t0)<16*H){const w=2*Math.PI*(t-CAL.fit.t0)/(12.42*H),c=CAL.fit.c;return c[0]+c[1]*Math.cos(w)+c[2]*Math.sin(w)}
  return modelH(t)}
const tideAt=t=>baseTide(t)+(CAL.resT?CAL.res*Math.exp(-Math.abs(t-CAL.resT)/(5*H)):0);
function calibrate(){
  TCACHE.clear();
  CAL={a:1,b:3,lag:0,res:0,resT:0,fit:null,src:D.om?'Forecast curve':'Estimate (moon model)'};
  const ea=D.ea&&D.ea.filter(r=>now()-r.t<30*H);
  if(ea&&ea.length>=8){
    if(D.om){let best=null;
      for(let lag=-90*6e4;lag<=90*6e4;lag+=10*6e4){const xs=[],ys=[];for(const r of ea){const x=omAt(r.t-lag);if(x!=null){xs.push(x);ys.push(r.v)}}
        if(xs.length<24)continue;const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;let sxy=0,sxx=0;
        for(let i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)**2}if(sxx<1e-6)continue;
        const a=clamp(sxy/sxx,.6,1.8),b=my-a*mx;let e=0;for(let i=0;i<n;i++)e+=(a*xs[i]+b-ys[i])**2;if(!best||e<best.e)best={a,b,lag,e}}
      if(best){CAL.a=best.a;CAL.b=best.b;CAL.lag=best.lag;CAL.src='Southend gauge + forecast'}}
    if(CAL.src!=='Southend gauge + forecast'){const pts=ea.filter(r=>now()-r.t<26*H);
      if(pts.length>=24){const t0=pts[pts.length-1].t,M=[[0,0,0],[0,0,0],[0,0,0]],v=[0,0,0];
        for(const r of pts){const w=2*Math.PI*(r.t-t0)/(12.42*H),f=[1,Math.cos(w),Math.sin(w)];for(let i=0;i<3;i++){v[i]+=f[i]*r.v;for(let j=0;j<3;j++)M[i][j]+=f[i]*f[j]}}
        const c=solve3(M,v);if(c){CAL.fit={t0,c};if(!D.om)CAL.src='Southend gauge (fitted)'}}}
    const last=ea[ea.length-1];if(now()-last.t<75*6e4){CAL.res=clamp(last.v-baseTide(last.t),-1.5,1.5);CAL.resT=last.t}
  }
}
function extremes(t0,hours){const st=3e5,out=[];let p=tideAt(t0+st)-tideAt(t0);
  for(let x=t0;x<t0+hours*H;x+=st){const d=tideAt(x+st)-tideAt(x);if(Math.sign(d)!==Math.sign(p)){out.push({t:x,type:d<0?'HW':'LW',h:tideAt(x)})}p=d}return out}
const TCACHE=new Map();
function tideInfo(t){const key=Math.round(t/3e5);if(TCACHE.has(key))return TCACHE.get(key);
  const st=3e5,h=tideAt(t),dh=(tideAt(t+6e5)-h)*6;
  const nx=extremes(t,14)[0]||{t:t+6*H,type:dh>0?'HW':'LW',h};
  let prevT=t-6*H,q=Math.sign(h-tideAt(t-st));
  for(let x=t-st;x>t-14*H;x-=st){if(Math.sign(tideAt(x)-tideAt(x-st))!==q){prevT=x;break}}
  const hp=tideAt(prevT),lo=Math.min(nx.h,hp),hi=Math.max(nx.h,hp),range=Math.max(.5,hi-lo);
  const v={h,rising:dh>0,frac:clamp((h-lo)/range,0,1),range,springs:clamp((range-3)/2.2,0,1.3),flow:Math.min(1,Math.abs(dh)/(2.6*2*Math.PI/12.42)),
    nextT:nx.t,nextType:nx.type,nextH:nx.h,src:CAL.src};
  if(TCACHE.size>2000)TCACHE.clear();TCACHE.set(key,v);return v}
const tideStage=T=>T.frac<.12?'Low water':T.rising?(T.frac>.6?'Late flood':'Flooding'):(T.frac>.7?'First of the ebb':'Ebbing');
const tideFactor=T=>T.frac<.12?.25:T.rising?.55+.9*T.frac:(T.frac>.7?1.3:.35+.6*T.frac);

// ---- sun / moon ----
const rad=Math.PI/180,J1970=2440588,J2000=2451545,E=rad*23.4397;
function sunTimes(t){const lw=rad*-LON,phi=rad*LAT,d=t/864e5-0.5+J1970-J2000,n=Math.round(d-0.0009-lw/(2*Math.PI));
  const ds=0.0009+lw/(2*Math.PI)+n,M=rad*(357.5291+0.98560028*ds),L=M+rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M))+rad*102.9372+Math.PI;
  const dec=Math.asin(Math.sin(E)*Math.sin(L)),Jn=J2000+ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
  const w=Math.acos((Math.sin(-0.833*rad)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec)));
  const a=0.0009+(w+lw)/(2*Math.PI)+n,Js=J2000+a+0.0053*Math.sin(M)-0.0069*Math.sin(2*L),Jr=Jn-(Js-Jn),f=j=>(j+0.5-J1970)*864e5;return{rise:f(Jr),set:f(Js)}}
function light(t){const s=sunTimes(t);if(Math.abs(t-s.rise)<H)return{ph:'dawn',s};if(Math.abs(t-s.set)<H)return{ph:'dusk',s};return{ph:(t>s.rise&&t<s.set)?'day':'night',s}}
const moonName=a=>a<1.8?'New':a<5.5?'Wax. cres.':a<9.2?'First qtr':a<12.9?'Wax. gib.':a<16.6?'Full':a<20.3?'Wan. gib.':a<24?'Last qtr':a<27.7?'Wan. cres.':'New';

// ---- weather at any hour ----
const SST_EST=[6,5.5,6.5,8.5,11.5,15,17.5,18.5,17,14.5,11,8];
const compass=d=>['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d/22.5)%16];
const WXCODE=c=>c===0?['☀️','Clear']:c<=2?['⛅','Part cloud']:c===3?['☁️','Overcast']:c<=48?['🌫️','Fog']:c<=57?['🌦️','Drizzle']:c<=67?['🌧️','Rain']:c<=77?['🌨️','Snow']:c<=82?['🌦️','Showers']:['⛈️','Thunder'];
function wxRaw(t){const w=D.wx;if(!w)return null;const h=w.h,i=Math.round((t-h.t[0])/H);
  const get=(k,j)=>h[k]&&j>=0&&j<h.t.length?h[k][j]:null;
  if(Math.abs(t-now())<40*6e4){const c=w.cur,p6=get('pressure_msl',i-6);
    return{temp:c.temperature_2m,rain:c.precipitation||0,cloud:c.cloud_cover||0,p:c.pressure_msl,dp:p6!=null?c.pressure_msl-p6:0,ws:c.wind_speed_10m||0,wd:c.wind_direction_10m||0,wg:c.wind_gusts_10m||0,code:c.weather_code||0}}
  if(i<0||i>=h.t.length||get('pressure_msl',i)==null)return null;
  const p6=get('pressure_msl',i-6);
  return{temp:get('temperature_2m',i),rain:get('precipitation',i)||0,cloud:get('cloud_cover',i)||0,p:get('pressure_msl',i),dp:p6!=null?get('pressure_msl',i)-p6:0,
    ws:get('wind_speed_10m',i)||0,wd:get('wind_direction_10m',i)||0,wg:get('wind_gusts_10m',i)||0,code:get('weather_code',i)||0}}
function weatherAt(t){
  const w=wxRaw(t),L=light(t).ph,day=L==='day';
  const o={ok:!!w,g:1,reasons:[],sst:omNear(D.om&&D.om.sst,t),wave:omNear(D.om&&D.om.wave,t)};
  if(o.sst==null){o.sst=SST_EST[month(t)-1];o.sstEst=true}
  if(w){Object.assign(o,w);o.dir=compass(w.wd);o.onshore=w.wd>=110&&w.wd<=250;o.offshore=w.wd>=290||w.wd<=70;
    if(w.ws>28||w.wg>42){o.g*=.6;o.reasons.push(['bad','Very windy ('+Math.round(w.ws)+' mph): hard to hold bottom or see bites'])}
    else if(o.onshore&&w.ws>=8){o.g*=1.25;o.reasons.push(['ok','Onshore '+o.dir+' wind colouring the water'])}
    else if(o.offshore&&w.ws>=10){o.g*=.85;o.reasons.push(['meh','Offshore '+o.dir+' wind flattening the sea'])}
    if(w.dp<=-1.5){o.g*=1.3;o.reasons.push(['ok','Pressure falling ('+w.dp.toFixed(1)+' hPa in 6h)'])}
    else if(w.dp>=2){o.g*=.85;o.reasons.push(['meh','Pressure rising fast'])}
    else if(w.p>1028){o.g*=.85;o.reasons.push(['meh','High, settled pressure'])}
    if(day&&w.cloud>70){o.g*=1.15;o.reasons.push(['ok','Overcast: fish less wary in daylight'])}
    else if(day&&w.cloud<20&&(o.wave==null||o.wave<.2)){o.g*=.8;o.reasons.push(['meh','Bright sun and clear water'])}
    if(w.rain>4){o.g*=.9;o.reasons.push(['meh','Heavy rain'])}}
  if(o.wave!=null){if(o.wave>.55)o.reasons.push(['ok','Lively sea ('+o.wave.toFixed(1)+' m): coloured water']);else if(o.wave<.15&&day)o.reasons.push(['meh','Flat calm, clear water'])}
  if(o.sst<6)o.reasons.push(['meh','Cold water ('+o.sst.toFixed(1)+'°C)']);
  return o}

// =====================================================================
// TACKLE & SPECIES KNOWLEDGE
// =====================================================================
const HOOKS=['6','4','2','1','1/0','2/0','3/0','4/0'];
const RIGS={f2:{name:'2-hook flapper',note:'Small fish: dabs, whiting, sole'},f3:{name:'3-hook flapper',note:'More baits out, more chances'},
  pp:{name:'Pulley pennel',note:'One big bait: cod, rays, hounds'},led:{name:'Running ledger',note:'Close in: bass, flounder, eels'},flt:{name:'Float rig',float:1,note:'Summer surface fish'}};
const BAITS={lug:{name:'Lugworm',note:'The all-rounder'},rag:{name:'Ragworm',note:'Flatties, sole, eels'},squid:{name:'Squid',note:'Tough, stays on'},

const DISTS={near:{name:'Close in',yd:45,note:'30–60 yd'},mid:{name:'Medium',yd:80,note:'60–100 yd'},far:{name:'Long',yd:115,note:'100+ yd'}};
const LEADS={plain:{name:'Plain lead',note:'Fine on small tides'},grip:{name:'Grip lead',note:'Holds in big tides'}};
const FISH={
  whiting:{name:'Whiting',m:[9,10,11,12,1,2,3],peak:[11,12,1],b:{lug:.8,squid:1,mackerel:1,rag:.4},hk:[2,4],r:{f2:1,f3:1,pp:.5,led:.5},nt:1.8,dy:.5,dist:'mid',w:[.15,.9],ab:1.3,tp:[4,13],
    note:'The winter staple after dark. Thin strips of squid or mackerel, or lug tipped with squid, on a 2- or 3-hook flapper. Rattly bites, often two at once.'},
  cod:{name:'Cod',m:[10,11,12,1,2,3],peak:[12,1],b:{lug:.9,squid:.8,peeler:1,mackerel:.4},hk:[5,7],r:{pp:1,led:.6,f2:.25},nt:1.5,dy:.6,dist:'far',w:[1,7],ab:.25,spr:1,tp:[2,12],col:1,wary:1,
    note:'The winter prize. A big lug-and-squid cocktail on a pulley pennel, cast long into coloured water on a big tide after dark. A blow from the south-west a day or two before often brings them in.'},
  dab:{name:'Dab',m:[10,11,12,1,2,3,4],b:{lug:1,rag:.8,squid:.3,mackerel:.2},hk:[0,2],r:{f2:1,f3:1,led:.4},nt:1.1,dy:1,dist:'mid',w:[.1,.45],ab:1,tp:[4,14],
    note:'Small, tasty flatfish. Fresh lug on small hooks; beads and attractor spoons help. They bite in daylight and on calmer days too.'},
  flounder:{name:'Flounder',m:[1,2,3,4,9,10,11,12],peak:[2,3],b:{rag:1,peeler:1,lug:.7},hk:[1,3],r:{f2:.8,f3:.8,led:1},nt:1.1,dy:1,dist:'near',w:[.25,1.3],ab:.8,tp:[3,18],
    note:'Close in over the mud, often only 30 yards out. Ragworm or peeler crab; they follow the flooding tide right up the beach. Best late winter into spring.'},
  thornback:{name:'Thornback ray',m:[4,5,6,7,8,9,10],peak:[5,6],b:{mackerel:1,squid:.9,peeler:.6,sandeel:.8},hk:[5,7],r:{pp:1,led:.6},nt:1.4,dy:.7,dist:'far',w:[1.5,6],ab:.4,spr:1,tp:[8,18],col:1,
    note:'Spring into summer. A big mackerel or squid bait on a pulley pennel, cast long. Big tides help. Let the bite develop: rays sit on the bait before taking it.'},
  smoothhound:{name:'Smoothhound',m:[5,6,7,8,9],peak:[5,6],b:{peeler:1,squid:.2},hk:[4,6],r:{pp:1,led:.8},nt:1.2,dy:.9,dist:'mid',w:[2,9],ab:.5,tp:[12,20],col:1,
    note:'The hard-fighting summer shark. Peeler crab is almost essential, so get it while the crabs are peeling (May–June). Use a good drag and strong line.'},

};
const tipsFor=f=>({baits:Object.keys(f.b).filter(k=>f.b[k]>=.8).map(k=>BAITS[k].name),hooks:'size '+HOOKS[f.hk[0]]+'–'+HOOKS[f.hk[1]],
  rigs:Object.keys(f.r).filter(k=>f.r[k]>=.8).map(k=>RIGS[k].name),dist:DISTS[f.dist].name.toLowerCase()+' ('+DISTS[f.dist].note+')',
  time:f.dd?'dawn & dusk':f.nt>1.4?'after dark':f.dy>1?'daylight':'any time'});

// ---- the brain: score each species for a setup at a moment ----
function ctxAt(t){return{t,mo:month(t),T:tideInfo(t),L:light(t).ph,W:weatherAt(t)}}
function scoreFish(f,set,c){
  const fac=[],hi=HOOKS.indexOf(set.hook),rig=RIGS[set.rig],tp=tipsFor(f);
  const add=(k,v,fix)=>{fac.push({k,v,fix});return v};
  let s=f.ab*(f.peak&&f.peak.includes(c.mo)?1.5:1);
  s*=add('bait',f.b[set.bait]||.08,'better baits: '+tp.baits.join(', '));
  const d=hi<f.hk[0]?f.hk[0]-hi:hi>f.hk[1]?hi-f.hk[1]:0;
  s*=add('hook',d===0?1:d===1?.55:.2,(hi<f.hk[0]?'hook too small':'hook too big')+', use '+tp.hooks);
  s*=add('rig',f.r[set.rig]||(rig.float?.03:f.pel?.1:.3),'best rig: '+(tp.rigs.join(' or ')||'float'));
  const tf=c.L==='night'?f.nt:c.L==='day'?f.dy:(f.dd||(f.nt+f.dy)/2),tmax=Math.max(f.nt,f.dy,f.dd||0);
  s*=tf;add('time',tf/tmax,'feeds best '+tp.time);
  const tdf=f.pel?(.8+.4*c.T.frac):tideFactor(c.T);s*=tdf;add('tide',tdf/1.3,'wait for the flood or the first of the ebb');
  if(f.spr)s*=.8+.5*Math.max(0,c.T.springs);
  const yd=DISTS[set.dist].yd,pref=DISTS[f.dist].yd,df=Math.exp(-Math.pow((yd-pref)/40,2))*.8+.2;s*=add('distance',df,'fish '+tp.dist);
  const td=c.W.sst<f.tp[0]?f.tp[0]-c.W.sst:c.W.sst>f.tp[1]?c.W.sst-f.tp[1]:0,tmpf=Math.exp(-Math.pow(td/3,2))*.85+.15;
  s*=add('water',tmpf,c.W.sst<f.tp[0]?'water too cold for them':'water too warm for them');
  if(!f.junk){
    const pull=c.T.flow*Math.max(.4,c.T.springs)+(c.W.ok&&c.W.onshore?c.W.ws/60:0);
    if(!rig.float&&set.lead==='plain'&&pull>.55)s*=add('lead',.45,'tide/wind will roll a plain lead: use a grip lead');
    s*=c.W.g;if(f.col&&c.W.wave!=null&&c.W.wave>.55)s*=1.2;if(f.wary&&c.W.wave!=null&&c.W.wave<.15&&c.L==='day')s*=.8}
  return{s,fac}}
function assess(set,c){const out=[],off=[];let tot=0;
  for(const k in FISH){const f=FISH[k];if(!f.m.includes(c.mo)){if(!f.junk)off.push(k);continue}
    const r=scoreFish(f,set,c);r.k=k;out.push(r);if(!f.junk)tot+=r.s}
  out.sort((a,b)=>b.s-a.s);return{list:out,tot,off}}
const chance=s=>s>=.45?['Good chance','#7ee081']:s>=.18?['Decent','#a6e3a1']:s>=.06?['Outside chance','#ffd166']:['Unlikely','#ff8a80'];
function overall(c){const tf=tideFactor(c.T),r=tf*c.W.g;
  const reasons=[[tf>=1?'ok':tf<.5?'bad':'meh',tideStage(c.T)+(tf>=1?': prime time':tf<.5?': the water is way out over the mud':'')],...c.W.reasons];
  if(c.L==='night')reasons.push(['ok','Dark: most estuary fish feed with more confidence']);
  if(c.L==='dawn'||c.L==='dusk')reasons.push(['ok',(c.L==='dawn'?'Dawn':'Dusk')+': a feeding window']);
  const lab=r>1.5?['Excellent','#7ee081']:r>1.05?['Good','#a6e3a1']:r>.7?['Fair','#ffd166']:['Poor','#ff8a80'];return{r,lab,reasons}}
function allSetups(){const a=[];for(const rig in RIGS)for(const hook of HOOKS)for(const bait in BAITS)for(const dist in DISTS){
  if(RIGS[rig].float){if(dist==='far')continue;a.push({rig,hook,bait,dist,lead:'plain'})}else for(const lead in LEADS)a.push({rig,hook,bait,dist,lead})}return a}
const SETUPS=allSetups();
function bestSetups(c){const res=SETUPS.map(set=>{const A=assess(set,c);let big=0;for(const r of A.list)if(!FISH[r.k].junk)big+=r.s*(FISH[r.k].w[0]+FISH[r.k].w[1])/2;return{set,A,tot:A.tot,big}});
  const pick=(key,n)=>{const seen=new Set(),out=[];for(const r of [...res].sort((a,b)=>b[key]-a[key])){const sig=r.set.rig+r.set.bait+r.set.dist;if(seen.has(sig))continue;seen.add(sig);out.push(r);if(out.length>=n)break}return out};
  const species={};for(const k in FISH){if(FISH[k].junk||!FISH[k].m.includes(c.mo))continue;let b=null;
    for(const set of SETUPS){const r=scoreFish(FISH[k],set,c);if(!b||r.s>b.s)b={s:r.s,set}}species[k]=b}
  return{most:pick('tot',3),big:pick('big',1)[0],species}}

const dayStart=(t,add=0)=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()+add);return d.getTime()};
const RANGE_MIN=()=>dayStart(now()),RANGE_MAX=()=>dayStart(now(),7)+23*H;
function setTime(t){if(t==null){selT=null}else{t=clamp(Math.round(t/H)*H,RANGE_MIN(),RANGE_MAX());selT=Math.abs(t-Math.floor(now()/H)*H)<1?null:t}render()}
const fmtDay=t=>{const d=dayStart(t),n=dayStart(now());return d===n?'Today':d===dayStart(now(),1)?'Tomorrow':new Date(t).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})};
const hasWx=t=>!!wxRaw(t);

const fmtWin=(a,b)=>hh(a)+':00–'+hh(b)+':00';
const rateCol=v=>v>1.5?'#7ee081':v>1.05?'#a6e3a1':v>.7?'#ffd166':'#ff8a80';
const rateLab=v=>v>1.5?'Excellent':v>1.05?'Good':v>.7?'Fair':'Poor';

function timeline(t0,valFn,colorFn,maxV){const vals=[],cols=[],labs=[];let best=null;
  for(let i=0;i<24;i++){const t=t0+i*H;vals.push({t,v:valFn(t)})}
  if(!maxV)maxV=Math.max(...vals.map(x=>x.v))*1.05||1;
  const ex=extremes(t0,24);
  for(const {t,v} of vals){const mark=ex.find(e=>e.t>=t&&e.t<t+H);
    cols.push('<div style="height:'+Math.max(4,Math.min(100,v/maxV*100))+'%;background:'+colorFn(v)+'">'+(mark?'<span>'+(mark.type==='HW'?'▲':'▽')+'</span>':'')+'</div>');
    labs.push('<span>'+(new Date(t).getHours()%3===0?hh(t):'')+'</span>')}
  for(let i=0;i<=21;i++){const avg=(vals[i].v+vals[i+1].v+vals[i+2].v)/3;if(!best||avg>best.avg)best={avg,a:vals[i].t,b:vals[i].t+3*H}}
  return{html:'<div class="tl">'+cols.join('')+'</div><div class="tlx">'+labs.join('')+'</div><div class="dim" style="font-size:13px;margin-top:6px">▲ high water &nbsp; ▽ low water</div>',best}}
function bestWindow(from,to,fn){let best=null;for(let t=from;t+2*H<=to;t+=H){const a=(fn(t)+fn(t+H)+fn(t+2*H))/3;if(!best||a>best.avg)best={avg:a,a:t,b:t+3*H}}return best}
function wxNote(c){return c.W.ok?'':'<div class="note">No weather forecast this far ahead yet. Using the tide, light, season and average sea temperature only.</div>'}

   const tl=timeline(Math.floor(c.t/H)*H,t=>assess(SET,ctxAt(t)).tot,v=>v>1.2?'#7ee081':v>.6?'#a6e3a1':v>.25?'#ffd166':'#ff8a80',0);
   const unl=A.list.filter(r=>r.s<=.02&&!FISH[r.k].junk);
   return '<h2>What will I catch?</h2>'+wxNote(c)+'<div class="card setline">'+setText(SET)+'<div style="margin-top:8px">Expect: <span class="pill" style="background:'+act[1]+'">'+act[0]+'</span></div><button class="plain" data-go="tackle" style="margin-top:10px">Change tackle</button></div>'+
   '<h3>Likely catches</h3>'+(A.list.filter(r=>r.s>.02).map(fishCard).join('')||'<div class="card">Nothing much with this setup. Try the ⭐ Recommended tab.</div>')+
   (unl.length?'<p class="dim" style="font-size:15px">Very unlikely: '+unl.map(r=>FISH[r.k].name).join(', ')+'</p>':'')+
   '<h3>This setup over 24 hours</h3><div class="card">'+tl.html+(tl.best?'<div class="big" style="margin-top:10px">⭐ Best time: <b>'+fmtWin(tl.best.a,tl.best.b)+'</b></div>':'')+'</div>'}],
 tackle:['🧰 Tackle',c=>{const hooks={};HOOKS.forEach((h,i)=>hooks[h]={name:'Size '+h,note:['tiny','small','small','medium','medium','large','large','huge'][i]});
   return '<h2>Your tackle</h2><div class="card setline">'+setText(SET)+'<br><button class="use" data-go="catch">See what I\'ll catch →</button></div>'+
   chipRow('rig',RIGS,'Rig')+chipRow('hook',hooks,'Hook size')+chipRow('bait',BAITS,'Bait')+chipRow('dist',DISTS,'Casting distance')+(RIGS[SET.rig].float?'':chipRow('lead',LEADS,'Lead'))}],
 best:['⭐ Recommended',c=>{const B=bestSetups(c),top=B.most[0];
   const useBtn=s=>'<button class="use" data-s=\''+JSON.stringify(s)+'\'>Use this setup</button>';
   return '<h2>Recommended</h2>'+wxNote(c)+
   '<div class="card"><div class="dim">🏆 MOST BITES</div><div class="setline" style="margin:6px 0">'+setText(top.set)+'</div>Mostly: '+top.A.list.filter(r=>!FISH[r.k].junk&&r.s>.06).slice(0,3).map(r=>FISH[r.k].name+' ('+chance(r.s)[0].toLowerCase()+')').join(', ')+'<br>'+useBtn(top.set)+'</div>'+
   (B.big&&JSON.stringify(B.big.set)!==JSON.stringify(top.set)?'<div class="card"><div class="dim">💪 BIGGER FISH</div><div class="setline" style="margin:6px 0">'+setText(B.big.set)+'</div>Targets: '+B.big.A.list.filter(r=>!FISH[r.k].junk&&r.s>.03).sort((a,b)=>FISH[b.k].w[1]-FISH[a.k].w[1]).slice(0,3).map(r=>FISH[r.k].name).join(', ')+'<br>'+useBtn(B.big.set)+'</div>':'')+
   '<h3>Target a species</h3>'+Object.entries(B.species).sort((a,b)=>b[1].s-a[1].s).map(([k,b])=>{const ch=chance(b.s);
     return '<div class="fish"><div class="top"><span class="name">'+FISH[k].name+'</span><span class="pill" style="background:'+ch[1]+'">'+ch[0]+'</span></div><div class="setline" style="margin-top:6px;font-size:16px">'+setText(b.set)+'</div>'+useBtn(b.set)+'</div>'}).join('')+
   '<p class="dim" style="font-size:14px">Worked out from the tide, light, wind, pressure, sea state and water temperature at the chosen time, across every combination of rig, hook, bait, distance and lead.</p>'}],
 species:['🐟 Species',c=>'<h2>Species guide</h2>'+Object.keys(FISH).map(k=>{const f=FISH[k],tp=tipsFor(f),inS=f.m.includes(c.mo);
   return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:19px">'+f.name+'</b>'+(inS?'<span class="pill" style="background:#7ee081">In season</span>':'<span class="dim" style="font-size:14px">Out of season</span>')+'</div>'+
   '<p style="margin:8px 0">'+f.note+'</p><table>'+
   '<tr><td class="k">Season</td><td>'+MONTHS[f.m[0]-1]+'–'+MONTHS[f.m[f.m.length-1]-1]+(f.peak?'<br><small>best '+f.peak.map(m=>MONTHS[m-1]).join(', ')+'</small>':'')+'</td></tr>'+
   (f.junk?'':'<tr><td class="k">Baits</td><td>'+tp.baits.join(', ')+'</td></tr><tr><td class="k">Hooks</td><td>'+tp.hooks+'</td></tr><tr><td class="k">Rig</td><td>'+(tp.rigs.join(' or ')||'float')+'</td></tr>'+
   '<tr><td class="k">Where</td><td>'+tp.dist+'</td></tr><tr><td class="k">When</td><td>'+tp.time+(f.spr?', bigger tides':'')+(f.col?', coloured water':'')+'</td></tr><tr><td class="k">Water</td><td>'+f.tp[0]+'–'+f.tp[1]+'°C</td></tr>'+
   '<tr><td class="k">Size</td><td>'+f.w[0]+'–'+f.w[1]+' kg</td></tr>')+'</table></div>'}).join('')],
 data:['📡 Data',c=>'<h2>Live data &amp; safety</h2><div class="card">'+Object.keys(FEEDS).map(k=>{const ok=D[k]&&!D.err[k],st=D[k]&&D.err[k];
     return '<div style="margin-bottom:10px">'+(ok?'✅':st?'🟠':'❌')+' '+FEEDS[k].name+'<br><small>'+(ok?'Updated '+ago(D.T[k]):st?'Saved data from '+ago(D.T[k])+' ('+D.err[k]+')':D.err[k]?'Failed: '+D.err[k]:'Loading…')+'</small></div>'}).join('')+
   '<button class="plain" id="refreshBtn">Refresh now</button></div>'+
   '<div class="card"><small>Forecasts reach about 7 days ahead. Further ahead than that, the app uses the tide model, daylight, season and average sea temperature.</small></div>'+
   '<div class="note"><b>⚠️ Safety</b><br>The tide floods fast across the Shoebury flats and can cut you off. Don\'t follow the water out over the mud, and know your way back before the flood starts. Parts of the beach next to the MOD ranges are off-limits: obey the signs and red flags.</div>'+
   '<p class="dim" style="font-size:13px">Weather &amp; marine data: Open-Meteo.com (CC BY 4.0). This uses Environment Agency tide gauge data from the real-time data API (Beta). Guide only, not for navigation.</p>']
};
function chipRow(key,opts,label){return '<h3>'+label+'</h3><div class="chips">'+Object.keys(opts).map(k=>'<button class="chip'+(SET[key]===k?' sel':'')+'" data-k="'+key+'" data-v="'+k+'">'+opts[k].name+'<small>'+opts[k].note+'</small></button>').join('')+'</div>'}
function fishCard(r){const f=FISH[r.k],ch=chance(r.s),lim=r.fac.filter(x=>x.v<.6).sort((a,b)=>a.v-b.v),col=f.junk?'#9db3ca':ch[1];
  return '<div class="fish"><div class="top"><span class="name">'+f.name+'</span><span class="pill" style="background:'+col+'">'+(f.junk?(r.s>.1?'Likely':'Some'):ch[0])+'</span></div>'+
   '<div class="meter"><i style="width:'+Math.min(100,r.s/1.6*100)+'%;background:'+col+'"></i></div>'+
   (!f.junk&&lim.length?'<div class="fix">Holding you back:<ul class="r" style="margin-top:2px">'+lim.slice(0,3).map(x=>'<li><b>'+x.k[0].toUpperCase()+x.k.slice(1)+'</b>: '+x.fix+'</li>').join('')+'</ul></div>':'')+
   (f.junk?'<div class="fix">'+f.note+'</div>':'')+'</div>'}

// ---------- header: time controls + tabs ----------
let cur='now';
function renderHeader(){const t=vt(),live=selT==null,fut=t>now()+30*6e4;
  $('tLabel').innerHTML='<b>'+fmtDay(t)+' '+new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'</b> <span style="background:'+(live?'#7ee081':fut?'#ffd166':'#9db3ca')+'">'+(live?'LIVE':fut?'FORECAST':'EARLIER')+'</span><br><i>'+($('tpanel').hidden?'▾ tap to change day/time':'▴ close')+'</i>';
  $('tLive').classList.toggle('on',live);
  const sel=dayStart(t);let dh='';for(let d=0;d<8;d++){const a=dayStart(now(),d),dt=new Date(a);
    dh+='<button data-day="'+a+'"'+(a===sel?' class="sel"':'')+'>'+(d===0?'Today':dt.toLocaleDateString('en-GB',{weekday:'short'}))+'<b>'+dt.getDate()+'</b></button>'}
  $('days').innerHTML=dh;$('tHour').value=new Date(t).getHours();
  $('tabs').innerHTML=Object.keys(TABS).map(k=>'<button data-tab="'+k+'"'+(k===cur?' class="on"':'')+'>'+TABS[k][0]+'</button>').join('');
  const on=$('tabs').querySelector('.on');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'})}
function render(){renderHeader();const c=ctxAt(vt());$('main').innerHTML=TABS[cur][1](c);wire()}
function go(tab){cur=tab;render();$('main').scrollTop=0}
function wire(){
  document.querySelectorAll('#main .chip').forEach(b=>b.onclick=()=>{SET[b.dataset.k]=b.dataset.v;if(RIGS[SET.rig].float&&SET.dist==='far')SET.dist='mid';saveSet();const y=$('main').scrollTop;render();$('main').scrollTop=y});
  document.querySelectorAll('#main .use[data-s]').forEach(b=>b.onclick=()=>{SET=JSON.parse(b.dataset.s);saveSet();go('catch')});
  document.querySelectorAll('#main [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('#main .dayrow').forEach(b=>b.onclick=()=>{cur='now';setTime(+b.dataset.t);$('main').scrollTop=0});
  const rb=$('refreshBtn');if(rb)rb.onclick=()=>{rb.textContent='Refreshing…';refresh()}}
$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)};
$('days').onclick=e=>{const b=e.target.closest('[data-day]');if(b)setTime(+b.dataset.day+new Date(vt()).getHours()*H)};
$('tHour').oninput=e=>setTime(dayStart(vt())+(+e.target.value)*H);
$('tPrev').onclick=()=>setTime(Math.floor(vt()/H)*H-H);
$('tNext').onclick=()=>setTime(Math.floor(vt()/H)*H+H);
$('tLive').onclick=()=>setTime(null);
$('tLabel').onclick=()=>{$('tpanel').hidden=!$('tpanel').hidden;renderHeader()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&now()-Math.max(D.T.wx||0,D.T.om||0)>10*6e4)refresh()});
calibrate();render();refresh();setInterval(refresh,15*6e4);
setInterval(()=>{if(selT==null&&cur!=='tackle')render()},60000);
</script>
</body>
