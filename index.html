<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1726">
<title>Shoebury Fishing Planner</title>
<style>
:root{--bg:#0b1726;--panel:#13243a;--panel2:#1a304c;--line:#22395a;--ink:#eef4fa;--dim:#9db3ca;--acc:#3fd0c9;--warn:#ffd166;--bad:#ff8a80;--good:#7ee081}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px}
.hrow{display:flex;align-items:center;gap:8px}
.ttl{flex:1;font-weight:700;font-size:17px}
#liveBtn{background:var(--panel2);border:1px solid #2c4a70;border-radius:10px;padding:6px 12px;font-size:14px;font-weight:700}
#liveBtn.on{background:var(--acc);color:#06121f;border-color:var(--acc)}
.when{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid #2c4a70;border-radius:12px;padding:8px 12px;margin-top:8px}
.when b{font-size:17px}
.when .tag{font-size:12px;font-weight:700;letter-spacing:.06em;padding:1px 7px;border-radius:5px;color:#06121f;margin-left:6px;vertical-align:2px}
.when i{float:right;font-style:normal;color:var(--acc);font-size:14px;margin-top:2px}
#whenPanel{padding-top:8px}
.lbl{font-size:13px;color:var(--dim);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}
.opt{flex:none;background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:6px 11px;font-size:15px;line-height:1.25;color:var(--dim)}
.opt b{display:block;color:var(--ink)}
.opt.sel{border-color:var(--acc);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--acc);height:28px;margin:2px 0}
.prow{display:flex;gap:8px;margin-top:10px}
.prow button{flex:1;background:var(--panel2);border:1px solid #2c4a70;border-radius:10px;padding:9px 6px;font-size:14px}
.prow button.pri{background:var(--acc);color:#06121f;border-color:var(--acc);font-weight:700}
main{flex:1;overflow-y:auto;padding:10px 12px 24px}
.seg{display:flex;gap:4px;background:var(--panel);border-radius:12px;padding:4px;margin-bottom:12px;position:sticky;top:-10px;z-index:2}
.seg button{flex:1;background:none;border:0;border-radius:9px;padding:8px 4px;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--panel2);color:var(--ink);font-weight:700}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:12px 0 14px;font-size:14px;color:var(--dim);border-top:3px solid transparent}
nav button.on{color:var(--ink);font-weight:700;border-top-color:var(--acc)}
h2{font-size:20px;margin:2px 0 10px}
h3{font-size:13px;color:var(--dim);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--panel);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.dim,small{color:var(--dim)}small{font-size:14px}
.pill{display:inline-block;padding:1px 8px;border-radius:6px;color:#06121f;font-weight:700;font-size:14px;white-space:nowrap}
ul.r{margin:6px 0 0;padding-left:20px}ul.r li{margin:4px 0}
.ok{color:var(--good)}.meh{color:var(--warn)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse}
td{padding:6px 0;vertical-align:top;border-bottom:1px solid #1d3352}
tr:last-child td{border-bottom:0}
td.k{color:var(--dim);width:38%;padding-right:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--panel);border-radius:12px;padding:9px 12px}
.tile div{font-size:13px;color:var(--dim)}
.tile b{font-size:19px;display:block;line-height:1.25}
.tile small{font-size:13px}
.hr{border-bottom:1px solid #1d3352;padding:8px 0}
.hr:last-child{border-bottom:0}
.hr .l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.hr .l1 b{font-size:16px}
.hr .l2{font-size:14px;color:var(--dim);margin-top:2px}
.hr .l2 em{font-style:normal;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);border:2px solid transparent;border-radius:10px;padding:7px 10px;text-align:left;font-size:15px}
.chip small{display:block;font-size:12px}
.chip.sel{border-color:var(--acc);background:#163a4a}
.meter{height:8px;background:#0a1422;border-radius:5px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;border-radius:5px}
.tl{display:flex;align-items:flex-end;gap:2px;height:100px;margin-top:16px}
.tl div{flex:1;border-radius:3px 3px 0 0;position:relative;min-height:3px}
.tl div.in{outline:2px solid var(--ink);outline-offset:-2px}
.tl div span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px}
.tlx{display:flex;gap:2px;font-size:11px;color:var(--dim);margin-top:4px}
.tlx span{flex:1;text-align:center}
button.act{background:var(--acc);color:#06121f;border:0;border-radius:9px;padding:8px 12px;font-weight:700;font-size:14px;margin-top:8px}
button.sec{background:var(--panel2);border:1px solid #2c4a70;border-radius:9px;padding:8px 12px;font-size:14px;margin-top:8px}
.setline b{color:var(--acc)}
.verdict{font-size:18px;line-height:1.4}
.check{list-style:none;padding:0;margin:4px 0 0}
.check li{padding:6px 0 6px 28px;position:relative;border-bottom:1px solid #1d3352;cursor:pointer}
.check li:last-child{border-bottom:0}
.check li:before{content:'';position:absolute;left:2px;top:10px;width:14px;height:14px;border:2px solid var(--dim);border-radius:3px}
.check li.done{color:var(--dim);text-decoration:line-through}
.check li.done:before{background:var(--acc);border-color:var(--acc)}
.note{background:#2a2410;border:1px solid #5a4a20;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:15px}
.dayrow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border-radius:12px;padding:10px 14px;margin-bottom:6px;width:100%;border:0;text-align:left}
.dayrow b{font-size:16px}
</style>
</head>
<body>
<header>
  <div class="hrow"><div class="ttl">Shoebury East · fishing planner</div><button id="liveBtn">Live</button></div>
  <button class="when" id="whenBtn"></button>
  <div id="whenPanel" hidden>
    <div class="lbl">Day</div><div class="hscroll" id="pDays"></div>
    <div class="lbl">Arrive at <b id="pHourLbl" style="color:var(--ink)"></b></div>
    <input type="range" id="pHour" min="0" max="23" step="1" aria-label="Arrival hour">
    <div class="lbl">Staying for</div><div class="hscroll" id="pDur"></div>
    <div class="prow"><button id="pNow">Going now</button><button id="pBest">Best time this week</button><button id="pDone" class="pri">Done</button></div>
  </div>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<script>


"use strict";
// =====================================================================
// LIVE DATA — Shoebury East (51.53N, 0.79E)
// EA Southend tide gauge (observed) calibrates the Open-Meteo marine tide
// curve; Open-Meteo forecast gives wind/pressure/cloud/rain hour by hour.
// Falls back to saved data, then an astronomical tide model.
// =====================================================================
const LAT=51.53,LON=0.79,SYN=29.530588853,NEWMOON=Date.UTC(2000,0,6,18,14),CD_OFF=2.9,H=3.6e6;
const now=()=>Date.now();
const month=t=>new Date(t).getMonth()+1;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const hm=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const hh=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit'});
const ago=t=>{const m=Math.round((now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' hr ago'};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const moonAge=t=>(((t-NEWMOON)/864e5)%SYN+SYN)%SYN;
function modelH(t){const a=moonAge(t),amp=2.05+0.55*Math.cos(2*Math.PI*(a-1.5)/(SYN/2)),Hm=((t/H)%24)-12-a*24/SYN;return 3.3+amp*Math.cos(2*Math.PI*(Hm-0.15)/12)}

const WXVARS='temperature_2m,precipitation,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code';
const FEEDS={
  ea:{name:'Southend tide gauge (Environment Agency)',
      url:'https://environment.data.gov.uk/flood-monitoring/id/stations/0019/readings?_sorted&_limit=120',
      parse:j=>{const a=(j.items||[]).filter(r=>typeof r.value==='number').map(r=>({t:Date.parse(r.dateTime),v:r.value+CD_OFF})).sort((x,y)=>x.t-y.t);
        if(a.length<8)throw Error('no recent readings');return a}},
  om:{name:'Tide curve, waves & sea temp (Open-Meteo marine)',
      url:'https://marine-api.open-meteo.com/v1/marine?latitude=51.50&longitude=0.85&hourly=sea_level_height_msl,wave_height,sea_surface_temperature&past_days=1&forecast_days=8&timeformat=unixtime&timezone=GMT&cell_selection=sea',
      parse:j=>{const h=j.hourly;if(!h||!h.time)throw Error('bad response');const sl=h.sea_level_height_msl||[];
        if(sl.filter(x=>x!=null).length<24)throw Error('no tide data for this spot');
        return{t:h.time.map(x=>x*1000),sl,wave:h.wave_height||[],sst:h.sea_surface_temperature||[]}}},
  wx:{name:'Wind, pressure, cloud & rain (Open-Meteo)',
      url:'https://api.open-meteo.com/v1/forecast?latitude=51.53&longitude=0.79&current='+WXVARS+'&hourly='+WXVARS+'&past_hours=7&forecast_hours=170&wind_speed_unit=mph&timeformat=unixtime&timezone=GMT',
      parse:j=>{if(!j.current||!j.hourly)throw Error('bad response');const h=j.hourly;h.t=h.time.map(x=>x*1000);return{cur:j.current,h}}}
};
const D={err:{},T:{}};
try{const c=JSON.parse(localStorage.getItem('sfish-data2'));if(c)for(const k in FEEDS)if(c[k]&&now()-c.T[k]<36*H){D[k]=c[k];D.T[k]=c.T[k]}}catch(e){}
async function refresh(){
  await Promise.all(Object.keys(FEEDS).map(async k=>{
    try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
      const r=await fetch(FEEDS[k].url,{cache:'no-store',signal:ctl.signal});clearTimeout(to);
      if(!r.ok)throw Error('HTTP '+r.status);D[k]=FEEDS[k].parse(await r.json());D.T[k]=now();D.err[k]=null}
    catch(e){D.err[k]=e.name==='AbortError'?'timed out':(e.message||String(e))}}));
  try{localStorage.setItem('sfish-data2',JSON.stringify({ea:D.ea,om:D.om,wx:D.wx,T:D.T}))}catch(e){}
  calibrate();render();
}

// ---- tide curve ----
let CAL={a:1,b:3,lag:0,res:0,resT:0,fit:null,src:'Estimate (moon model)'};
function omAt(t){const o=D.om;if(!o)return null;const n=o.t.length,dt=o.t[1]-o.t[0],f=(t-o.t[0])/dt,i=Math.floor(f);if(i<1||i>n-3)return null;
  const p0=o.sl[i-1],p1=o.sl[i],p2=o.sl[i+1],p3=o.sl[i+2];if([p0,p1,p2,p3].some(x=>x==null))return null;
  const u=f-i;return .5*(2*p1+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u*u+(-p0+3*p1-3*p2+p3)*u*u*u)}
function omNear(arr,t){const o=D.om;if(!o||!arr||!arr.length)return null;const i=Math.round((t-o.t[0])/(o.t[1]-o.t[0]));return i>=0&&i<arr.length?arr[i]:null}
function solve3(M,v){M=M.map((r,i)=>[...r,v[i]]);for(let c=0;c<3;c++){let p=c;for(let r=c+1;r<3;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];
  if(Math.abs(M[c][c])<1e-9)return null;for(let r=0;r<3;r++)if(r!==c){const f=M[r][c]/M[c][c];for(let k=c;k<4;k++)M[r][k]-=f*M[c][k]}}return M.map((r,i)=>r[3]/r[i])}
function baseTide(t){
  if(D.om){const v=omAt(t-CAL.lag);if(v!=null)return CAL.a*v+CAL.b}
  if(CAL.fit&&Math.abs(t-CAL.fit.t0)<16*H){const w=2*Math.PI*(t-CAL.fit.t0)/(12.42*H),c=CAL.fit.c;return c[0]+c[1]*Math.cos(w)+c[2]*Math.sin(w)}
  return modelH(t)}
const tideAt=t=>baseTide(t)+(CAL.resT?CAL.res*Math.exp(-Math.abs(t-CAL.resT)/(5*H)):0);
function calibrate(){
  TCACHE.clear();
  CAL={a:1,b:3,lag:0,res:0,resT:0,fit:null,src:D.om?'Forecast curve':'Estimate (moon model)'};
  const ea=D.ea&&D.ea.filter(r=>now()-r.t<30*H);
  if(ea&&ea.length>=8){
    if(D.om){let best=null;
      for(let lag=-90*6e4;lag<=90*6e4;lag+=10*6e4){const xs=[],ys=[];for(const r of ea){const x=omAt(r.t-lag);if(x!=null){xs.push(x);ys.push(r.v)}}
        if(xs.length<24)continue;const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;let sxy=0,sxx=0;
        for(let i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)**2}if(sxx<1e-6)continue;
        const a=clamp(sxy/sxx,.6,1.8),b=my-a*mx;let e=0;for(let i=0;i<n;i++)e+=(a*xs[i]+b-ys[i])**2;if(!best||e<best.e)best={a,b,lag,e}}
      if(best){CAL.a=best.a;CAL.b=best.b;CAL.lag=best.lag;CAL.src='Southend gauge + forecast'}}
    if(CAL.src!=='Southend gauge + forecast'){const pts=ea.filter(r=>now()-r.t<26*H);
      if(pts.length>=24){const t0=pts[pts.length-1].t,M=[[0,0,0],[0,0,0],[0,0,0]],v=[0,0,0];
        for(const r of pts){const w=2*Math.PI*(r.t-t0)/(12.42*H),f=[1,Math.cos(w),Math.sin(w)];for(let i=0;i<3;i++){v[i]+=f[i]*r.v;for(let j=0;j<3;j++)M[i][j]+=f[i]*f[j]}}
        const c=solve3(M,v);if(c){CAL.fit={t0,c};if(!D.om)CAL.src='Southend gauge (fitted)'}}}
    const last=ea[ea.length-1];if(now()-last.t<75*6e4){CAL.res=clamp(last.v-baseTide(last.t),-1.5,1.5);CAL.resT=last.t}
  }
}
function extremes(t0,hours){const st=3e5,out=[];let p=tideAt(t0+st)-tideAt(t0);
  for(let x=t0;x<t0+hours*H;x+=st){const d=tideAt(x+st)-tideAt(x);if(Math.sign(d)!==Math.sign(p)){out.push({t:x,type:d<0?'HW':'LW',h:tideAt(x)})}p=d}return out}
const TCACHE=new Map();
function tideInfo(t){const key=Math.round(t/3e5);if(TCACHE.has(key))return TCACHE.get(key);
  const st=3e5,h=tideAt(t),dh=(tideAt(t+6e5)-h)*6;
  const nx=extremes(t,14)[0]||{t:t+6*H,type:dh>0?'HW':'LW',h};
  let prevT=t-6*H,q=Math.sign(h-tideAt(t-st));
  for(let x=t-st;x>t-14*H;x-=st){if(Math.sign(tideAt(x)-tideAt(x-st))!==q){prevT=x;break}}
  const hp=tideAt(prevT),lo=Math.min(nx.h,hp),hi=Math.max(nx.h,hp),range=Math.max(.5,hi-lo);
  const v={h,rising:dh>0,frac:clamp((h-lo)/range,0,1),range,springs:clamp((range-3)/2.2,0,1.3),flow:Math.min(1,Math.abs(dh)/(2.6*2*Math.PI/12.42)),
    nextT:nx.t,nextType:nx.type,nextH:nx.h,src:CAL.src};
  if(TCACHE.size>2000)TCACHE.clear();TCACHE.set(key,v);return v}
const tideStage=T=>T.frac<.12?'Low water':T.rising?(T.frac>.6?'Late flood':'Flooding'):(T.frac>.7?'First of the ebb':'Ebbing');
const tideFactor=T=>T.frac<.12?.25:T.rising?.55+.9*T.frac:(T.frac>.7?1.3:.35+.6*T.frac);

// ---- sun / moon ----
const rad=Math.PI/180,J1970=2440588,J2000=2451545,E=rad*23.4397;
function sunTimes(t){const lw=rad*-LON,phi=rad*LAT,d=t/864e5-0.5+J1970-J2000,n=Math.round(d-0.0009-lw/(2*Math.PI));
  const ds=0.0009+lw/(2*Math.PI)+n,M=rad*(357.5291+0.98560028*ds),L=M+rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M))+rad*102.9372+Math.PI;
  const dec=Math.asin(Math.sin(E)*Math.sin(L)),Jn=J2000+ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
  const w=Math.acos((Math.sin(-0.833*rad)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec)));
  const a=0.0009+(w+lw)/(2*Math.PI)+n,Js=J2000+a+0.0053*Math.sin(M)-0.0069*Math.sin(2*L),Jr=Jn-(Js-Jn),f=j=>(j+0.5-J1970)*864e5;return{rise:f(Jr),set:f(Js)}}
function light(t){const s=sunTimes(t);if(Math.abs(t-s.rise)<H)return{ph:'dawn',s};if(Math.abs(t-s.set)<H)return{ph:'dusk',s};return{ph:(t>s.rise&&t<s.set)?'day':'night',s}}
const moonName=a=>a<1.8?'New':a<5.5?'Wax. cres.':a<9.2?'First qtr':a<12.9?'Wax. gib.':a<16.6?'Full':a<20.3?'Wan. gib.':a<24?'Last qtr':a<27.7?'Wan. cres.':'New';

// ---- weather at any hour ----
const SST_EST=[6,5.5,6.5,8.5,11.5,15,17.5,18.5,17,14.5,11,8];
const compass=d=>['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d/22.5)%16];
const WXCODE=c=>c===0?['☀️','Clear']:c<=2?['⛅','Part cloud']:c===3?['☁️','Overcast']:c<=48?['🌫️','Fog']:c<=57?['🌦️','Drizzle']:c<=67?['🌧️','Rain']:c<=77?['🌨️','Snow']:c<=82?['🌦️','Showers']:['⛈️','Thunder'];
function wxRaw(t){const w=D.wx;if(!w)return null;const h=w.h,i=Math.round((t-h.t[0])/H);
  const get=(k,j)=>h[k]&&j>=0&&j<h.t.length?h[k][j]:null;
  if(Math.abs(t-now())<40*6e4){const c=w.cur,p6=get('pressure_msl',i-6);
    return{temp:c.temperature_2m,rain:c.precipitation||0,cloud:c.cloud_cover||0,p:c.pressure_msl,dp:p6!=null?c.pressure_msl-p6:0,ws:c.wind_speed_10m||0,wd:c.wind_direction_10m||0,wg:c.wind_gusts_10m||0,code:c.weather_code||0}}
  if(i<0||i>=h.t.length||get('pressure_msl',i)==null)return null;
  const p6=get('pressure_msl',i-6);
  return{temp:get('temperature_2m',i),rain:get('precipitation',i)||0,cloud:get('cloud_cover',i)||0,p:get('pressure_msl',i),dp:p6!=null?get('pressure_msl',i)-p6:0,
    ws:get('wind_speed_10m',i)||0,wd:get('wind_direction_10m',i)||0,wg:get('wind_gusts_10m',i)||0,code:get('weather_code',i)||0}}
function weatherAt(t){
  const w=wxRaw(t),L=light(t).ph,day=L==='day';
  const o={ok:!!w,g:1,reasons:[],sst:omNear(D.om&&D.om.sst,t),wave:omNear(D.om&&D.om.wave,t)};
  if(o.sst==null){o.sst=SST_EST[month(t)-1];o.sstEst=true}
  if(w){Object.assign(o,w);o.dir=compass(w.wd);o.onshore=w.wd>=110&&w.wd<=250;o.offshore=w.wd>=290||w.wd<=70;
    if(w.ws>28||w.wg>42){o.g*=.6;o.reasons.push(['bad','Very strong wind ('+Math.round(w.ws)+' mph): hard to hold bottom or see bites'])}
    else if(o.onshore&&w.ws>=8){o.g*=1.25;o.reasons.push(['ok','Onshore '+o.dir+' wind colouring the water'])}
    else if(o.offshore&&w.ws>=10){o.g*=.85;o.reasons.push(['meh','Offshore '+o.dir+' wind flattening the sea'])}
    if(w.dp<=-1.5){o.g*=1.3;o.reasons.push(['ok','Pressure falling ('+w.dp.toFixed(1)+' hPa in 6h)'])}

const tipsFor=f=>({baits:Object.keys(f.b).filter(k=>f.b[k]>=.8).map(k=>BAITS[k].name),hooks:'size '+HOOKS[f.hk[0]]+'–'+HOOKS[f.hk[1]],
  rigs:Object.keys(f.r).filter(k=>f.r[k]>=.8).map(k=>RIGS[k].name),dist:DISTS[f.dist].name.toLowerCase()+' ('+DISTS[f.dist].note+')',
  time:f.dd?'dawn & dusk':f.nt>1.4?'after dark':f.dy>1?'daylight':'any time'});

// ---- the brain: score each species for a setup at a moment ----
function ctxAt(t){return{t,mo:month(t),T:tideInfo(t),L:light(t).ph,W:weatherAt(t)}}
function scoreFish(f,set,c){
  const fac=[],hi=HOOKS.indexOf(set.hook),rig=RIGS[set.rig],tp=tipsFor(f);
  const add=(k,v,fix)=>{fac.push({k,v,fix});return v};
  let s=f.ab*(f.peak&&f.peak.includes(c.mo)?1.5:1);
  s*=add('bait',f.b[set.bait]||.08,'better baits: '+tp.baits.join(', '));
  const d=hi<f.hk[0]?f.hk[0]-hi:hi>f.hk[1]?hi-f.hk[1]:0;
  s*=add('hook',d===0?1:d===1?.55:.2,(hi<f.hk[0]?'hook too small':'hook too big')+', use '+tp.hooks);
  s*=add('rig',f.r[set.rig]||(rig.float?.03:f.pel?.1:.3),'best rig: '+(tp.rigs.join(' or ')||'float'));
  const tf=c.L==='night'?f.nt:c.L==='day'?f.dy:(f.dd||(f.nt+f.dy)/2),tmax=Math.max(f.nt,f.dy,f.dd||0);

  const td=c.W.sst<f.tp[0]?f.tp[0]-c.W.sst:c.W.sst>f.tp[1]?c.W.sst-f.tp[1]:0,tmpf=Math.exp(-Math.pow(td/3,2))*.85+.15;
  s*=add('water',tmpf,c.W.sst<f.tp[0]?'water too cold for them':'water too warm for them');
  if(!f.junk){
    const pull=c.T.flow*Math.max(.4,c.T.springs)+(c.W.ok&&c.W.onshore?c.W.ws/60:0);
    if(!rig.float&&set.lead==='plain'&&pull>.55)s*=add('lead',.45,'tide/wind will roll a plain lead: use a grip lead');
    s*=c.W.g;if(f.col&&c.W.wave!=null&&c.W.wave>.55)s*=1.2;if(f.wary&&c.W.wave!=null&&c.W.wave<.15&&c.L==='day')s*=.8}

function assess(set,c){const out=[],off=[];let tot=0;

    const r=scoreFish(f,set,c);r.k=k;out.push(r);if(!f.junk)tot+=r.s}
  out.sort((a,b)=>b.s-a.s);return{list:out,tot,off}}
const chance=s=>s>=.45?['Good chance','#7ee081']:s>=.18?['Decent','#a6e3a1']:s>=.06?['Outside chance','#ffd166']:['Unlikely','#ff8a80'];
function overall(c){const tf=tideFactor(c.T),r=tf*c.W.g;
  const reasons=[[tf>=1?'ok':tf<.5?'bad':'meh',tideStage(c.T)+(tf>=1?': prime time':tf<.5?': the water is way out over the mud':'')],...c.W.reasons];
  if(c.L==='night')reasons.push(['ok','Dark: most estuary fish feed with more confidence']);
  if(c.L==='dawn'||c.L==='dusk')reasons.push(['ok',(c.L==='dawn'?'Dawn':'Dusk')+': a feeding window']);
  const lab=r>1.5?['Excellent','#7ee081']:r>1.05?['Good','#a6e3a1']:r>.7?['Fair','#ffd166']:['Poor','#ff8a80'];return{r,lab,reasons}}
function allSetups(){const a=[];for(const rig in RIGS)for(const hook of HOOKS)for(const bait in BAITS)for(const dist in DISTS){
  if(RIGS[rig].float){if(dist==='far')continue;a.push({rig,hook,bait,dist,lead:'plain'})}else for(const lead in LEADS)a.push({rig,hook,bait,dist,lead})}return a}

  const pick=(key,n)=>{const seen=new Set(),out=[];for(const r of [...res].sort((a,b)=>b[key]-a[key])){const sig=r.set.rig+r.set.bait+r.set.dist;if(seen.has(sig))continue;seen.add(sig);out.push(r);if(out.length>=n)break}return out};
  const species={};for(const k in FISH){if(FISH[k].junk||!FISH[k].m.includes(c.mo))continue;let b=null;
    for(const set of SETUPS){const r=scoreFish(FISH[k],set,c);if(!b||r.s>b.s)b={s:r.s,set}}species[k]=b}
  return{most:pick('tot',3),big:pick('big',1)[0],species}}

// ---------- trip state ----------
let TRIP={start:null,hours:4};
try{const t=JSON.parse(localStorage.getItem('sfish-trip'));if(t&&t.hours){TRIP=t;if(TRIP.start!=null&&TRIP.start+TRIP.hours*H<now())TRIP.start=null}}catch(e){}
const saveTrip=()=>{try{localStorage.setItem('sfish-trip',JSON.stringify(TRIP))}catch(e){}};
const isLive=()=>TRIP.start==null;
const vt=()=>TRIP.start??now();
const sStart=()=>TRIP.start??Math.floor(now()/H)*H;
const sEnd=()=>(TRIP.start??now())+TRIP.hours*H;
function setTrip(start,hours){if(hours)TRIP.hours=hours;if(start!==undefined)TRIP.start=start==null?null:clamp(Math.round(start/H)*H,dayStart(now()),dayStart(now(),7)+23*H);saveTrip();render()}

let SET={rig:'f2',hook:'1',bait:'lug',dist:'mid',lead:'plain'};
try{const s=JSON.parse(localStorage.getItem('sfish-setup'));if(s&&RIGS[s.rig])SET=s}catch(e){}
const saveSet=()=>{try{localStorage.setItem('sfish-setup',JSON.stringify(SET))}catch(e){}};

// ---------- session analysis ----------
const SPK=Object.keys(FISH);
let PC={key:''};
function plan(){
  const t0=sStart(),n=TRIP.hours,key=[t0,n,D.T.wx,D.T.om,D.T.ea,isLive()].join('|');
  if(PC.key===key)return PC.v;
  const hs=[],cs=[];for(let i=0;i<n;i++){const t=t0+i*H;hs.push(t);cs.push(ctxAt(i===0&&isLive()?now():t))}
  const N=SETUPS.length,K=SPK.length,tot=new Float64Array(N*n),big=new Float64Array(N*n),sp=new Float64Array(N*n*K);
  for(let s=0;s<N;s++)for(let h=0;h<n;h++){const A=assess(SETUPS[s],cs[h]);tot[s*n+h]=A.tot;let b=0;
    for(const r of A.list){sp[(s*n+h)*K+SPK.indexOf(r.k)]=r.s;if(!FISH[r.k].junk)b+=r.s*(FISH[r.k].w[0]+FISH[r.k].w[1])/2}big[s*n+h]=b}
  const sum=(arr,s)=>{let x=0;for(let h=0;h<n;h++)x+=arr[s*n+h];return x/n};
  let best=0,bigB=0;for(let s=1;s<N;s++){if(sum(tot,s)>sum(tot,best))best=s;if(sum(big,s)>sum(big,bigB))bigB=s}
  const hourBest=hs.map((_,h)=>{let b=0;for(let s=1;s<N;s++)if(tot[s*n+h]>tot[b*n+h])b=s;return tot[best*n+h]>=tot[b*n+h]*.9?best:b});
  const rating=cs.map(c=>overall(c));
  const spOf=(s,k,h)=>sp[(s*n+h)*K+SPK.indexOf(k)];
  const species=SPK.filter(k=>FISH[k].m.includes(cs[0].mo)||FISH[k].m.includes(cs[n-1].mo)).map(k=>{
    let avg=0,mx=0,mxH=0;for(let h=0;h<n;h++){const v=spOf(best,k,h);avg+=v/n;if(v>mx){mx=v;mxH=h}}
    let tb=0,tv=-1;for(let s=0;s<N;s++){let v=0;for(let h=0;h<n;h++)v+=spOf(s,k,h);if(v>tv){tv=v;tb=s}}
    return{k,avg,mx,mxH,target:SETUPS[tb],targetAvg:tv/n}}).sort((a,b)=>b.avg-a.avg);
  const v={t0,n,hs,cs,tot,best:SETUPS[best],bestAvg:sum(tot,best),big:SETUPS[bigB],hourBest:hourBest.map(i=>SETUPS[i]),hourTot:hourBest.map((s,h)=>tot[s*n+h]),
    rating,avgR:rating.reduce((a,r)=>a+r.r,0)/n,species,bestTotAt:h=>tot[best*n+h]};
  PC={key,v};return v}
function phases(P){const out=[];P.hourBest.forEach((s,h)=>{const sig=s.rig+s.bait+s.dist;const l=out[out.length-1];

  return out}
function advice(P){
  const L=[],S=[],t0=P.t0,t1=t0+P.n*H,T0=P.cs[0].T,ex=extremes(t0-30*6e4,P.n+.5).filter(e=>e.t<t1),lt=light(t0),lt1=light(t1);
  L.push('On arrival ('+hm(P.isLive?now():t0)+') the tide is <b>'+tideStage(T0).toLowerCase()+'</b> at '+T0.h.toFixed(1)+' m and '+(T0.rising?'rising':'falling')+'.');
  if(T0.frac<.25&&T0.rising){const i=P.cs.findIndex(c=>c.T.frac>.35);L.push('The water is well out when you arrive. Fish close in to start'+(i>0?'. Fishing should pick up from about <b>'+hm(P.hs[i])+'</b> as the flood builds.':'.'))}
  if(T0.frac<.3&&!T0.rising)L.push('You arrive late in the ebb. Expect it to be slow until the tide turns at about <b>'+hm(T0.nextT)+'</b>.');
  for(const e of ex){if(e.type==='HW')L.push('High water <b>'+hm(e.t)+'</b> ('+e.h.toFixed(1)+' m). The best period is usually <b>'+hm(e.t-2*H)+'–'+hm(e.t+H)+'</b>: the last two hours of the flood and the first hour of the ebb.');
    else L.push('Low water <b>'+hm(e.t)+'</b> ('+e.h.toFixed(1)+' m). Expect a quiet spell from '+hm(e.t-H)+' to '+hm(e.t+H)+'. Use it to rebait and check traces.')}

  if(ss)L.push('Sunset <b>'+hm(ss)+'</b>. Whiting, cod, sole and eels feed better after dark, so expect more bites from about '+hm(ss+30*6e4)+'.');
  if(sr)L.push('Sunrise <b>'+hm(sr)+'</b>. The hour around dawn is a feeding window, especially for bass.');
  const ph=phases(P);
  if(ph.length>1)L.push('Change your setup as conditions change: '+ph.map(p=>'<b>'+hm(P.hs[p.from])+'</b> '+setShort(p.set)).join('; ')+'.');
  const pull=P.cs.some(c=>c.T.flow*Math.max(.4,c.T.springs)+(c.W.ok&&c.W.onshore?c.W.ws/60:0)>.55);
  if(pull)L.push('Use <b>grip leads</b>. The tide'+(P.cs.some(c=>c.W.ok&&c.W.onshore&&c.W.ws>15)?' and the onshore wind':'')+' will move a plain lead.');
  const wmax=Math.max(...P.cs.map(c=>c.W.ok?c.W.ws:0));
  if(wmax>18){const c=P.cs.find(c=>c.W.ok&&c.W.ws===wmax);L.push('Wind up to '+Math.round(wmax)+' mph '+c.W.dir+'. '+(c.W.onshore?'It\'s onshore, so expect shorter casts and lots of tip movement. Keep the rod tips high and watch for a steady pull rather than knocks.':'It\'s offshore, which helps casting but flattens the sea.'))}
  if(FISH.crab.m.includes(P.cs[0].mo))L.push('Crabs are active this month. Check baits every 10–15 minutes and use bait elastic; squid lasts longest.');
  const rain=P.cs.reduce((a,c)=>a+(c.W.ok?c.W.rain:0),0);if(rain>.5)L.push('About '+rain.toFixed(1)+' mm of rain is forecast during the session.');
  if(!P.cs.every(c=>c.W.ok))L.push('<span class="meh">No weather forecast is available yet for part of this session, so those hours use only tide, light and season.</span>');
  // safety

function kit(P){
  const items=[],ph=phases(P),need={},hooks={},rigs={};
  for(const p of ph){const hrs=p.to-p.from+1,s=p.set;need[s.bait]=(need[s.bait]||0)+4*BAIT_PER_CAST[s.rig]*hrs;hooks[s.hook]=1;rigs[s.rig]=(rigs[s.rig]||0)+1}
  if(!sameSet(P.big,P.best)){hooks[P.big.hook]=1;rigs[P.big.rig]=(rigs[P.big.rig]||0)+1}
  const unit={lug:n=>Math.ceil(n)+' lugworm',rag:n=>Math.ceil(n)+' ragworm',squid:n=>Math.ceil(n/10)+' squid (about 10 strips each)',mackerel:n=>Math.ceil(n/12)+' mackerel (about 12 strips each)',peeler:n=>Math.ceil(n/2)+' peeler crabs',sandeel:n=>Math.ceil(n)+' sandeels'};
  for(const b in need)items.push('Bait: '+unit[b](need[b]*1.25)+'. That\'s enough for about '+P.n+' hours at one cast every 15 minutes, plus 25% spare.');
  if(!need[P.big.bait])items.push('Bait for the bigger-fish setup: '+unit[P.big.bait](4*BAIT_PER_CAST[P.big.rig]*2)+'.');
  items.push('Rigs: '+Object.keys(rigs).map(r=>'3 × '+RIGS[r].name.toLowerCase()).join(', ')+' (spares for snags and tangles).');
  items.push('Hooks: size '+Object.keys(hooks).sort((a,b)=>HOOKS.indexOf(a)-HOOKS.indexOf(b)).join(', ')+', with at least 10 spares.');
  const pull=P.cs.some(c=>c.T.flow*Math.max(.4,c.T.springs)+(c.W.ok&&c.W.onshore?c.W.ws/60:0)>.55);
  items.push(pull?'Leads: 5–6 oz grip leads, 4+ (the tide/wind will move plain leads).':'Leads: 4–5 oz plain leads, plus 2 grip leads in case the flow picks up.');
  items.push('Rod(s), reel(s) and a tripod or rod rest.');
  if(P.cs.some(c=>c.L!=='day'))items.push('Headtorch and spare batteries, plus rod-tip lights or isotopes.');
  const tmin=Math.min(...P.cs.filter(c=>c.W.ok).map(c=>c.W.temp));
  if(P.cs.some(c=>c.W.ok&&(c.W.rain>.1||(c.W.code>=51&&c.W.code<=82))))items.push('Waterproof jacket and trousers.');
  if(isFinite(tmin)&&tmin<10)items.push('Warm layers'+(tmin<5?', hat and gloves':'')+' (down to '+Math.round(tmin)+'°C, colder with wind chill).');
  if([5,6,7,8,9].includes(P.cs[0].mo)&&P.cs.some(c=>c.L==='day'&&c.W.ok&&c.W.cloud<40))items.push('Sun cream and a hat.');
  if(FISH.crab.m.includes(P.cs[0].mo))items.push('Bait elastic, for the crabs.');
  items.push('Wellies or boots for the mud.');
  items.push('Bait knife and board, disgorger and forceps, towel, and a bag or bucket for any fish you keep.');
  if(P.species.some(s=>s.k==='bass'&&s.avg>.06))items.push('Check the current bass size limit and bag rules before keeping any.');
  items.push('Fully charged phone.');

function alternatives(P){const n=P.n,fn=t=>overall(ctxAt(t)).r,out=[];
  const win=(from,to)=>{let b=null;for(let t=from;t+n*H<=to+1;t+=H){let a=0;for(let i=0;i<n;i++)a+=fn(t+i*H);a/=n;if(!b||a>b.avg)b={avg:a,t}}return b};
  const d0=dayStart(P.t0),sd=win(Math.max(d0,Math.floor(now()/H)*H),d0+24*H);
  if(sd&&sd.avg>P.avgR*1.12&&Math.abs(sd.t-P.t0)>=2*H)out.push({lab:'Same day, '+hm(sd.t)+'–'+hm(sd.t+n*H),...sd});
  const wk=[];for(let d=0;d<8;d++){const a=dayStart(now(),d);const w=win(Math.max(a,Math.floor(now()/H)*H),a+24*H);if(w)wk.push(w)}
  wk.sort((a,b)=>b.avg-a.avg);for(const w of wk.slice(0,3))if(w.avg>P.avgR*1.12&&Math.abs(w.t-P.t0)>=2*H&&!out.some(o=>o.t===w.t))out.push({lab:fmtDay(w.t)+', '+hm(w.t)+'–'+hm(w.t+n*H),...w});
  return out}

function timeline(t0,valFn,colorFn,maxV,inFrom,inTo){const vals=[],cols=[],labs=[];
  for(let i=0;i<24;i++){const t=t0+i*H;vals.push({t,v:valFn(t)})}
  if(!maxV)maxV=Math.max(...vals.map(x=>x.v))*1.05||1;
  const ex=extremes(t0,24);
  for(const {t,v} of vals){const mark=ex.find(e=>e.t>=t&&e.t<t+H),inS=inFrom!=null&&t>=inFrom&&t<inTo;
    cols.push('<div class="'+(inS?'in':'')+'" style="height:'+Math.max(4,Math.min(100,v/maxV*100))+'%;background:'+colorFn(v)+'">'+(mark?'<span>'+(mark.type==='HW'?'▲':'▽')+'</span>':'')+'</div>');
    labs.push('<span>'+(new Date(t).getHours()%3===0?String(new Date(t).getHours()).padStart(2,'0'):'')+'</span>')}
  return '<div class="tl">'+cols.join('')+'</div><div class="tlx">'+labs.join('')+'</div><div class="dim" style="font-size:12px;margin-top:4px">▲ high water · ▽ low water'+(inFrom!=null?' · outlined = your session':'')+'</div>'}

      return '<div class="card"><div class="hr" style="padding-top:0"><div class="l1"><b>'+FISH[s.k].name+'</b>'+pill(ch[0],ch[1])+'</div></div><div class="setline" style="font-size:15px">'+setText(s.target)+'</div><button class="sec" data-use=\''+JSON.stringify(s.target)+'\'>Use as my setup</button></div>'}).join('')}
  return '<div class="seg">'+Object.keys(CATCH_SEG).map(k=>'<button data-sub="'+k+'"'+(k===sub?' class="on"':'')+'>'+CATCH_SEG[k]+'</button>').join('')+'</div>'+h}
function chipRow(key,opts,label){return '<div class="lbl">'+label+'</div><div class="chips" style="margin-bottom:6px">'+Object.keys(opts).map(k=>'<button class="chip'+(SET[key]===k?' sel':'')+'" data-k="'+key+'" data-v="'+k+'">'+opts[k].name+'<small>'+opts[k].note+'</small></button>').join('')+'</div>'}
function scrSpecies(){const mo=month(vt());return SPK.map(k=>{const f=FISH[k],tp=tipsFor(f),inS=f.m.includes(mo);
  return '<div class="card"><div class="l1" style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">'+f.name+'</b>'+(inS?pill('In season','#7ee081'):'<small>Out of season</small>')+'</div>'+
  '<p style="margin:6px 0">'+f.note+'</p><table>'+
  '<tr><td class="k">Season</td><td>'+MONTHS[f.m[0]-1]+'–'+MONTHS[f.m[f.m.length-1]-1]+(f.peak?' (best '+f.peak.map(m=>MONTHS[m-1]).join(', ')+')':'')+'</td></tr>'+
  (f.junk?'':'<tr><td class="k">Baits</td><td>'+tp.baits.join(', ')+'</td></tr><tr><td class="k">Hooks</td><td>'+tp.hooks+'</td></tr><tr><td class="k">Rig</td><td>'+(tp.rigs.join(' or ')||'float')+'</td></tr>'+
  '<tr><td class="k">Distance</td><td>'+tp.dist+'</td></tr><tr><td class="k">When</td><td>'+tp.time+(f.spr?', bigger tides':'')+(f.col?', coloured water':'')+'</td></tr><tr><td class="k">Water temp</td><td>'+f.tp[0]+'–'+f.tp[1]+'°C</td></tr>'+
  '<tr><td class="k">Typical size</td><td>'+f.w[0]+'–'+f.w[1]+' kg</td></tr>')+'</table></div>'}).join('')}
function scrData(){return '<div class="card">'+Object.keys(FEEDS).map(k=>{const ok=D[k]&&!D.err[k],st=D[k]&&D.err[k];
   return '<div class="hr"><div class="l1"><b>'+FEEDS[k].name+'</b>'+pill(ok?'OK':st?'Saved':'Failed',ok?'#7ee081':st?'#ffd166':'#ff8a80')+'</div><div class="l2">'+(ok?'Updated '+ago(D.T[k]):st?'Using data from '+ago(D.T[k])+' ('+D.err[k]+')':D.err[k]?D.err[k]:'Loading…')+'</div></div>'}).join('')+
  '<button class="sec" id="refreshBtn">Refresh now</button></div>'+
  '<div class="card"><small><b>How the predictions work.</b> Each species is scored on season, bait, hook size, rig, casting distance, light, tide stage, tide size, water temperature, wind, pressure trend, cloud and sea state, using general knowledge of these fish in the Thames estuary. The planner tries all '+SETUPS.length+' tackle combinations for every hour of your session. Forecasts reach about 7 days ahead; beyond that, only the tide, light and season are used.</small></div>'+
  '<div class="card"><small>Tides: Environment Agency Southend gauge, lined up with the Open-Meteo marine tide curve. If neither is available, an astronomical estimate (±30 min). Weather and marine data: Open-Meteo.com (CC BY 4.0). This uses Environment Agency tide gauge data from the real-time data API (Beta). For planning only, not for navigation.</small></div>'}

// ---------- shell ----------
const NAV={plan:'Plan',cond:'Conditions',catch:'Catch',species:'Species',data:'Data'};
let cur='plan',sub={cond:'overview',catch:'mine'};
function renderHeader(){const live=isLive(),a=vt(),b=sEnd(),fut=!live&&TRIP.start>now();
  $('liveBtn').classList.toggle('on',live);
  $('whenBtn').innerHTML='<i>'+($('whenPanel').hidden?'Change ▾':'Close ▴')+'</i><b>'+(live?'Going now':fmtDay(a))+'</b> · '+hm(a)+'–'+hm(b)+'<span class="tag" style="background:'+(live?'#7ee081':fut?'#ffd166':'#9db3ca')+'">'+(live?'LIVE':fut?'FORECAST':'EARLIER')+'</span>';
  if(!$('whenPanel').hidden){const sd=dayStart(a);
    $('pDays').innerHTML=[...Array(8)].map((_,d)=>{const x=dayStart(now(),d),dt=new Date(x);return '<button class="opt'+(x===sd?' sel':'')+'" data-day="'+x+'">'+(d===0?'Today':dt.toLocaleDateString('en-GB',{weekday:'short'}))+'<b>'+dt.getDate()+'</b></button>'}).join('');
    $('pHour').value=new Date(a).getHours();$('pHourLbl').textContent=String(new Date(a).getHours()).padStart(2,'0')+':00';
    $('pDur').innerHTML=[2,3,4,5,6,8].map(x=>'<button class="opt'+(x===TRIP.hours?' sel':'')+'" data-dur="'+x+'"><b>'+x+' h</b></button>').join('')}
  $('nav').innerHTML=Object.keys(NAV).map(k=>'<button data-nav="'+k+'"'+(k===cur?' class="on"':'')+'>'+NAV[k]+'</button>').join('')}
function render(){renderHeader();const y=$('main').scrollTop;
  $('main').innerHTML=cur==='plan'?scrPlan():cur==='cond'?scrCond(sub.cond):cur==='catch'?scrCatch(sub.catch):cur==='species'?scrSpecies():scrData();
  return y}
function go(tab){cur=tab;render();$('main').scrollTop=0}
$('main').onclick=e=>{const t=e.target.closest('button,li');if(!t)return;
  if(t.dataset.sub){sub[cur]=t.dataset.sub;render();return}
  if(t.dataset.use){SET=JSON.parse(t.dataset.use);saveSet();cur='catch';sub.catch='mine';render();$('main').scrollTop=0;return}
  if(t.dataset.trip){setTrip(+t.dataset.trip);cur='plan';render();$('main').scrollTop=0;return}
  if(t.dataset.k){SET[t.dataset.k]=t.dataset.v;if(RIGS[SET.rig].float&&SET.dist==='far')SET.dist='mid';saveSet();const y=render();$('main').scrollTop=y;return}
  if(t.id==='refreshBtn'){t.textContent='Refreshing…';refresh();return}
  if(t.tagName==='LI'&&t.closest('#kit'))t.classList.toggle('done')};
$('nav').onclick=e=>{const b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav)};
$('whenBtn').onclick=()=>{$('whenPanel').hidden=!$('whenPanel').hidden;renderHeader()};
$('pDays').onclick=e=>{const b=e.target.closest('[data-day]');if(b){const hr=new Date(vt()).getHours();setTrip(+b.dataset.day+hr*H)}};
$('pHour').oninput=e=>{$('pHourLbl').textContent=String(e.target.value).padStart(2,'0')+':00'};
$('pHour').onchange=e=>setTrip(dayStart(vt())+(+e.target.value)*H);
$('pDur').onclick=e=>{const b=e.target.closest('[data-dur]');if(b)setTrip(undefined,+b.dataset.dur)};
$('pNow').onclick=()=>{setTrip(null);$('whenPanel').hidden=true;renderHeader()};
$('pDone').onclick=()=>{$('whenPanel').hidden=true;renderHeader();go('plan')};
$('pBest').onclick=()=>{const n=TRIP.hours;let b=null;for(let d=0;d<8;d++){const a=dayStart(now(),d);for(let t=Math.max(a,Math.ceil(now()/H)*H);t+n*H<=a+24*H;t+=H){let v=0;for(let i=0;i<n;i++)v+=overall(ctxAt(t+i*H)).r;v/=n;if(!b||v>b.v)b={v,t}}}
  if(b){setTrip(b.t);$('whenPanel').hidden=true;go('plan')}};
$('liveBtn').onclick=()=>setTrip(null);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&now()-Math.max(D.T.wx||0,D.T.om||0)>10*6e4)refresh()});
calibrate();render();refresh();setInterval(refresh,15*6e4);
setInterval(()=>{if(isLive()&&!(cur==='catch'&&sub.catch==='mine')){const y=render();$('main').scrollTop=y}},120000);
</script>
</body>
</html>
